name: Publish Add-in to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      addin_base_url:
        description: "Optional public URL for the add-in, including trailing slash"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve add-in base URL
        shell: bash
        run: |
          INPUT_URL="${{ github.event.inputs.addin_base_url }}"
          VAR_URL="${{ vars.ADDIN_BASE_URL }}"

          if [ -n "$INPUT_URL" ]; then
            BASE_URL="$INPUT_URL"
          elif [ -n "$VAR_URL" ]; then
            BASE_URL="$VAR_URL"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io/"
          else
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

          if [[ "$BASE_URL" != */ ]]; then
            BASE_URL="$BASE_URL/"
          fi

          echo "ADDIN_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build static add-in
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
